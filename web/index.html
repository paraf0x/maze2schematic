<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maze2schematic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>maze2schematic</h1>

    <ul id="messages" aria-live="polite"></ul>

    <section class="group">
      <h2>Maze</h2>
      <label class="field">
        <span>Columns</span>
        <input id="cols" type="number" min="2" max="200" value="20">
      </label>
      <label class="field">
        <span>Rows</span>
        <input id="rows" type="number" min="2" max="200" value="20">
      </label>
      <label class="field">
        <span>Seed</span>
        <input id="seed" type="number">
      </label>
    </section>

    <section class="group">
      <h2>Preset</h2>
      <label class="field">
        <span>Dungeon</span>
        <select id="dungeon">
          <option value="custom">custom</option>
          <option value="labyrinth">labyrinth</option>
          <option value="catacombs">catacombs</option>
          <option value="hedge">hedge</option>
          <option value="palace">palace</option>
          <option value="fortress">fortress</option>
          <option value="suburb">suburb</option>
          <option value="city">city</option>
          <option value="pacman">pacman</option>
          <option value="starship">starship</option>
          <option value="garden">garden</option>
          <option value="forbidden">forbidden</option>
        </select>
      </label>
    </section>

    <section class="group">
      <h2>Parameters</h2>
      <label class="field range">
        <span>Straightness</span>
        <input id="straightness" type="range" min="0" max="1" step="0.01" value="0">
      </label>
      <label class="field range">
        <span>Shortcuts</span>
        <input id="shortcuts" type="range" min="0" max="1" step="0.01" value="0">
      </label>
      <label class="field range">
        <span>Coverage</span>
        <input id="coverage" type="range" min="0" max="1" step="0.01" value="1">
      </label>
      <label class="field range">
        <span>Rooms</span>
        <input id="rooms" type="range" min="0" max="1" step="0.01" value="0">
      </label>
    </section>

    <section class="group">
      <h2>Borders &amp; Symmetry</h2>
      <label class="field checkbox"><input id="h-loop" type="checkbox"> Horizontal: loop</label>
      <label class="field checkbox"><input id="v-loop" type="checkbox"> Vertical: loop</label>
      <label class="field checkbox"><input id="h-mirror" type="checkbox"> Horizontal: mirror</label>
      <label class="field checkbox"><input id="v-mirror" type="checkbox"> Vertical: mirror</label>
      <label class="field checkbox"><input id="h-border" type="checkbox" checked> Horizontal: border</label>
      <label class="field checkbox"><input id="v-border" type="checkbox" checked> Vertical: border</label>
      <label class="field checkbox"><input id="entrances" type="checkbox" checked> Entrance/exit</label>
    </section>

    <section class="group">
      <h2>Schematic</h2>
      <label class="field">
        <span>Name</span>
        <input id="schematic-name" type="text" value="maze">
      </label>
      <label class="field">
        <span>Author</span>
        <input id="author" type="text" value="maze2schematic-web">
      </label>
    </section>

    <section class="group">
      <h2>Tile Set</h2>
      <label class="field">
        <span>Theme</span>
        <select id="theme-select"></select>
      </label>
      <div class="theme-actions">
        <button id="theme-save" type="button">Save as theme…</button>
        <button id="theme-delete" type="button" disabled>Delete</button>
      </div>
      <div id="tile-drop">Drop your own <code>.litematic</code> tiles here</div>
      <label id="tile-add">
        Add tiles…
        <input id="tile-file-input" type="file" multiple accept=".litematic">
      </label>
      <div id="tile-manager"></div>
      <button id="tile-reset" type="button">Reset theme</button>
    </section>

    <button id="download-btn" type="button" class="primary">Download .litematic</button>
  </aside>

  <main id="preview">
    <nav id="tabs">
      <button id="tab-maze" type="button" class="tab active">Maze</button>
      <button id="tab-topdown" type="button" class="tab">Top-Down</button>
      <button id="tab-3d" type="button" class="tab">3D</button>
    </nav>
    <div id="preview-body">
      <canvas id="maze-canvas"></canvas>
      <canvas id="topdown-canvas"></canvas>
      <div id="view-3d"></div>
    </div>
  </main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
